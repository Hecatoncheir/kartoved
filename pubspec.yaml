name: kartoved
description: Картовед — автономный сканер карт Magic для Android и браузера.
publish_to: none
version: 1.0.5+15
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  camera: ^0.11.0
  camera_view_mask:
    git:
      url: https://github.com/Hecatoncheir/camera_view_mask.git
      ref: 2e7bf583d14b9dafd54c1aa8680e7eda930172fa
  crypto: ^3.0.6
  image: ^4.5.4
  image_picker: ^1.2.0
  http: ^1.6.0
  onnxruntime_core: 0.1.0+onnxruntime-1.29.0
  onnxruntime_binaries: 1.29.0+1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.2.0
  flutter_bloc: ^8.1.6
  sensors_plus: ^7.1.1
  web: ^1.1.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7
flutter:
  uses-material-design: true
  shaders:
    - shaders/scan_glass.frag
  assets:
    - assets/design/
    - assets/oracle/
    - assets/mtg_identification/
    - assets/paddleocr/
    - assets/licenses/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
