<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#282828">
  <title>Картовед — коллекции</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="symbol-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-brand" viewBox="0 0 24 24"><path d="M7 5.8 4.4 6.5a2 2 0 0 0-1.4 2.4l2.8 10.3a2 2 0 0 0 2.4 1.4l1.1-.3"/><rect x="8" y="3" width="12" height="17" rx="2"/><path d="m14 7 1.2 3.1 3.1 1.2-3.1 1.2-1.2 3.1-1.2-3.1-3.1-1.2 3.1-1.2L14 7Z"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18m-12 4h6M7 3h10"/></symbol>
    <symbol id="i-catalog" viewBox="0 0 24 24"><rect x="3.5" y="4" width="6" height="6" rx="1"/><rect x="14.5" y="4" width="6" height="6" rx="1"/><rect x="3.5" y="14" width="6" height="6" rx="1"/><rect x="14.5" y="14" width="6" height="6" rx="1"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3m0 8v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3m-1-9h10"/></symbol>
    <symbol id="i-backup" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.4 3 7 8 9 5-2 8-4.6 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15 15 4.3 4.3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 1c5-5 9 3 14 0v11c-5 3-9-5-14 0"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5m-18 4 9 5 9-5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3m-5 5 5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 7h15m-4-4 4 4-4 4m5 6H5m4-4-4 4 4 4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M8 5 6 8H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-2l-2-3Z"/><circle cx="12" cy="14" r="3.25"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M5 4h14l3 9v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5l3-9Z"/><path d="M2 13h6l2 3h4l2-3h6"/></symbol>
  </svg>

  <aside class="sidebar" aria-label="Основная навигация">
    <a class="brand" href="#library">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-brand"></use></svg></span>
      <span><strong>Картовед</strong><small>Magic: The Gathering</small></span>
    </a>
    <nav class="side-nav" aria-label="Разделы">
      <a href="#library" data-nav="library"><svg class="icon" aria-hidden="true"><use href="#i-library"></use></svg> Коллекции</a>
      <a href="#catalog" data-nav="catalog"><svg class="icon" aria-hidden="true"><use href="#i-catalog"></use></svg> Каталог</a>
      <a href="#scan" data-nav="scan"><svg class="icon" aria-hidden="true"><use href="#i-scan"></use></svg> Сканер</a>
    </nav>
    <div class="local-status"><span></span><div><strong>На устройстве</strong><small>Доступно офлайн</small></div></div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <a class="brand mobile-brand" href="#library">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-brand"></use></svg></span>
        <strong>Картовед</strong>
      </a>
      <form class="global-search search-field" id="global-search" role="search" aria-label="Поиск по библиотеке">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="global-query" type="search" aria-label="Найти карту в каталоге" placeholder="Найти карту…" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </form>
      <div class="topbar-actions">
        <a class="icon-button mobile-search" href="#catalog" aria-label="Найти карту"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg></a>
        <button class="backup-button button button-light" type="button" data-action="backup" aria-label="Резервная копия"><svg class="icon" aria-hidden="true"><use href="#i-backup"></use></svg><span>Резервная копия</span></button>
      </div>
    </header>
    <main class="content" id="screen" tabindex="-1"></main>
  </div>

  <nav class="mobile-nav" aria-label="Разделы">
    <a href="#library" data-nav="library"><svg class="icon" aria-hidden="true"><use href="#i-library"></use></svg><span>Коллекции</span></a>
    <a class="mobile-scan" href="#scan" data-nav="scan"><span class="scan-icon"><svg class="icon" aria-hidden="true"><use href="#i-scan"></use></svg></span><span>Сканер</span></a>
    <a href="#catalog" data-nav="catalog"><svg class="icon" aria-hidden="true"><use href="#i-catalog"></use></svg><span>Каталог</span></a>
  </nav>

  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div class="toast" id="toast" hidden>
    <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>
    <span id="toast-message" role="status"></span>
    <button id="toast-undo" type="button" hidden>Отменить</button>
  </div>
  <noscript><p>Включите JavaScript, чтобы открыть прототип Картоведа.</p></noscript>
</body>
</html>
