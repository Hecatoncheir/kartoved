name: Проверка Android
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub test
      - name: Подготовить контрольное изображение
        run: |
          python -c "import base64,json,pathlib; p=pathlib.Path('test/fixtures/bouncers-beatdown.jpg'); pathlib.Path('.dart_tool/fixture.json').write_text(json.dumps({'CARD_JPEG':base64.b64encode(p.read_bytes()).decode()}))"
      - name: Открыть доступ к KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Распознать карту без сети на Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            flutter test integration_test/offline_test.dart -d emulator-5554 --dart-define-from-file=.dart_tool/fixture.json --timeout 10m
      - name: Проверить автономный каталог внутри APK
        run: python tool/verify_apk.py build/app/outputs/flutter-apk/app-debug.apk

