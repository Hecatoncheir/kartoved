name: Выпуск Android
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - name: Подготовить описание версии
        run: python tool/release_notes.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub test
      - name: Собрать и проверить подписанный APK
        env:
          KEY_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KARTOVED_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export KARTOVED_KEYSTORE="$RUNNER_TEMP/kartoved.p12"
          trap 'rm -f "$KARTOVED_KEYSTORE"' EXIT
          test -n "$KEY_DATA"
          test -n "$KARTOVED_STORE_PASSWORD"
          printf '%s' "$KEY_DATA" | base64 --decode > "$KARTOVED_KEYSTORE"
          flutter build apk --release --target-platform android-arm64
          apk="kartoved-$GITHUB_REF_NAME-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          python tool/verify_apk.py "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" | tee "$RUNNER_TEMP/cert.txt"
          fingerprint=$(keytool -exportcert -alias kartoved -keystore "$KARTOVED_KEYSTORE" -storepass:env KARTOVED_STORE_PASSWORD | sha256sum | cut -d' ' -f1)
          grep -Fi "certificate SHA-256 digest: $fingerprint" "$RUNNER_TEMP/cert.txt"
      - name: Опубликовать APK и описание на странице версии
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag --title "Картовед ${tag#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" "kartoved-$tag-arm64.apk" --clobber
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md" --draft=false
